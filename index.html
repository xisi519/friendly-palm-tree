<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小电 · 机电传动智能助教 · 武汉理工大学</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="logo"><img src="/assets/xiaodian-avatar.svg" alt="小电" title="小电"></span>
    <div>
      <h1>小电 · 机电传动智能助教</h1>
      <p id="sub">武汉理工大学《机电传动控制》· 教材：吴超群、雷艇 主编（机械工业出版社） · <span id="modeBadge" class="badge">检索模式</span></p>
    </div>
  </div>
  <button id="btnAdmin" class="icon" title="管理（开发者模式）" aria-label="管理">&#9881;</button>
</header>

<main id="chat">
  <div id="msgs" aria-live="polite"></div>
  <div id="quick"></div>
  <form id="inputbar" autocomplete="off">
    <textarea id="q" rows="1" placeholder="问我机电传动的知识点、公式、计算题、控制线路、PLC……（Enter 发送）"></textarea>
    <button id="btnAsk" type="submit">发送</button>
  </form>
</main>

<aside id="drawer" aria-hidden="true">
  <div class="dhead">
    <div>
      <h2>管理</h2>
      <p class="hint">修改知识库需要开启开发者模式并验证密码</p>
    </div>
    <button id="btnCloseDrawer" class="icon" title="关闭">&times;</button>
  </div>

  <div class="switchrow">
    <div>
      <b>开发者模式</b>
      <p class="hint" id="devHint">关闭时知识库只读，任何人无法篡改</p>
    </div>
    <label class="switch"><input type="checkbox" id="devSwitch"><span class="slider"></span></label>
  </div>

  <div id="loginBox">
    <p class="hint">输入管理密码以解锁知识库编辑权限。</p>
    <input id="pwd" type="password" placeholder="管理密码" autocomplete="current-password">
    <p id="loginErr" class="err"></p>
    <button id="btnUnlock" class="primary">解锁</button>
  </div>

  <div id="adminBox" class="hidden">
    <nav class="dtabs">
      <button class="dtab active" data-dt="add">添加考点</button>
      <button class="dtab" data-dt="cards">知识卡</button>
      <button class="dtab" data-dt="gaps">缺口</button>
      <button class="dtab" data-dt="sec">安全</button>
    </nav>

    <section id="dt-add" class="dpane active">
      <div class="field"><label>标题 *</label><input id="fTitle" placeholder="例：第4章必考——Y-Δ 起动电流与转矩都是 1/3"></div>
      <div class="field"><label>关键词（逗号分隔，影响检索）</label><input id="fKw" placeholder="Y-Δ, 降压起动, 转矩"></div>
      <div class="field row2">
        <div><label>考点等级</label><select id="fExam"><option>必考</option><option>高频</option><option>老师强调</option><option>了解</option></select></div>
        <div><label>章节</label><input id="fCh" placeholder="例：交流异步电动机"></div>
      </div>
      <div class="field"><label>正文 *（支持 Markdown）</label><textarea id="fBody" rows="8" placeholder="老师原话、公式、解题模板、易错点……"></textarea></div>
      <button id="btnSaveCard" class="primary">保存为老师考点</button>
      <p id="saveMsg" class="ok"></p>
    </section>

    <section id="dt-cards" class="dpane">
      <input id="cardSearch" placeholder="搜索知识卡…">
      <div id="cardList"></div>
    </section>

    <section id="dt-gaps" class="dpane">
      <p class="hint">学生问过但知识库答不上的问题。补录后此处会清空对应条目。</p>
      <div id="gapList"></div>
    </section>

    <section id="dt-sec" class="dpane">
      <div class="field"><label>新管理密码</label><input id="np1" type="password" autocomplete="new-password"></div>
      <div class="field"><label>重复新密码</label><input id="np2" type="password" autocomplete="new-password"></div>
      <button id="btnChPwd" class="primary">修改密码</button>
      <p id="pwdMsg" class="ok"></p>
      <hr>
      <div id="srvInfo" class="hint"></div>
      <button id="btnLock" class="danger">立即锁定</button>
    </section>
  </div>
</aside>
<div id="scrim" class="hidden"></div>

<script src="/knowledge.js"></script>
<script src="/engine.js"></script>
<script src="/ui.js"></script>
</body>
</html>
