# 小电 · 机电传动智能助教（公网版）— Cloudflare Pages 配置
# 两种部署方式任选其一：
#   A. Dashboard（推荐给不熟悉 CLI 的同学）：在 Cloudflare 后台创建 Pages 项目，
#      上传 web/ 目录 + cloudflare/functions 目录（把这两个目录的内容合并为项目根目录上传）。
#   B. CLI：npm i -g wrangler 后执行 wrangler pages deploy web --project-name xxx
#      （Functions 目录须位于项目根：请把 cloudflare/functions 复制到 web/../ 下或按 CLI 文档调整）
# 注意：Pages 的静态站点根是 web/，functions 目录必须与 web/ 同级——CLI 部署时用 deploy 命令的 --directory。
# 本文件主要服务于「Dashboard 绑定 KV 与变量」的参考，实际绑定请在 Pages 项目 Settings -> Bindings 中完成。

name = "xiaodian-tutor"

# Pages Functions + 静态站点根
pages_build_output_dir = "web"

# 变量（也可在 Pages 后台 Settings -> Variables and Secrets 配置，效果相同）
[vars]
# MODEL = "gpt-4o-mini"

# KV 命名空间：在 Dashboard 创建后，把 id 填到这里（或直接在后台 Bindings 里绑定）
# [[kv_namespaces]]
# binding = "KB"
# id = "粘贴你的 KV 命名空间 ID"