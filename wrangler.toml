# 小电 · 机电传动智能助教（公网版）— Cloudflare Pages 配置
# 部署方式：网页版 Cloudflare Dashboard 连接 GitHub 仓库（推荐给不熟悉 CLI 的同学）：
#   1) 把 deploy-cf/ 里的全部内容传到 GitHub 仓库根目录；
#   2) Cloudflare -> Workers & Pages -> Create -> Pages -> Connect to Git -> 选该仓库；
#   3) 框架预设 None，构建命令留空，输出目录填 /，保存并部署；
#   4) 在项目 Settings -> Bindings 里绑定 KV（变量名 KB）并添加 ADMIN_PASSWORD 等变量。
# 注意：本包为「合并布局」——静态文件在仓库根目录、functions/ 也在根目录，
#       所以输出目录必须是根目录（"."），不能是 web/。

name = "xiaodian-tutor"
pages_build_output_dir = "."

# 变量（也可在 Pages 后台 Settings -> Variables and Secrets 配置，效果相同）
[vars]
# MODEL = "gpt-4o-mini"

# KV 命名空间：在 Dashboard 创建后，到项目 Settings -> Bindings 里绑定即可，
# 不需要在这里填 id。
# [[kv_namespaces]]
# binding = "KB"
# id = "粘贴你的 KV 命名空间 ID"
